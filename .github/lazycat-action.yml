version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/typewords.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: typewords

build:
  toolchains: []
  run_buildscript: false

images:
  - id: typewords
    target: service
    service: typewords
    source: zyronon/typewords
    channel: stable
    tag_regex: '^\d+\.\d+\.\d+$'
    version_regex: '^(?P<version>\d+\.\d+\.\d+)$'
    delivery:
      mode: mirror
      image_template: docker.1ms.run/zyronon/typewords:{tag}
      require_digest_match: true

stores:
  official:
    enabled: false
    skip_if_version_exists: false
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: false
    name: TypeWords
    summary: "TypeWords packaged for LazyCat"
